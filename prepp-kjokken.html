<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="manifest.json">
<title>Fager Bistro – Kjøkken MEP</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif; background: #f7f6f3; color: #1a1a1a; min-height: 100vh; }

header { background: #1a1a1a; padding: 1rem 1.25rem; padding-top: calc(1rem + env(safe-area-inset-top)); display: flex; align-items: center; gap: 0.75rem; position: sticky; top: 0; z-index: 100; }
.back-btn { background: none; border: none; color: rgba(255,255,255,0.6); font-size: 0.85rem; cursor: pointer; display: flex; align-items: center; gap: 4px; padding: 0; flex-shrink: 0; text-decoration: none; }
.header-title { font-size: 0.95rem; font-weight: 600; color: #fff; flex: 1; }
.header-actions { display: flex; gap: 0.4rem; flex-wrap: wrap; justify-content: flex-end; }
.person-filter { display: flex; gap: 0.5rem; padding: 0.75rem 1.25rem; background: #fff; border-bottom: 1px solid #e5e2da; }
.person-btn { padding: 0.45rem 1rem; border-radius: 999px; border: 1px solid #e5e2da; background: #f7f6f3; color: #5a5855; font-size: 0.82rem; font-weight: 600; cursor: pointer; }
.person-btn.active { background: #1a1a1a; color: #fff; border-color: #1a1a1a; }
@media print { .person-filter { display: none !important; } }
.btn-sm { padding: 0.4rem 0.6rem; border-radius: 8px; font-size: 0.72rem; font-weight: 600; cursor: pointer; border: none; letter-spacing: 0.02em; white-space: nowrap; }
.btn-reset { background: rgba(255,255,255,0.12); color: rgba(255,255,255,0.85); }
.btn-add { background: #fff; color: #1a1a1a; }

.main { padding: 1rem 1.25rem; padding-bottom: calc(2rem + env(safe-area-inset-bottom)); max-width: 600px; margin: 0 auto; }

.kategori-block { margin-bottom: 2rem; }
.kategori-header { font-size: 1rem; font-weight: 700; color: #1a1a1a; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 0.75rem; padding-bottom: 0.5rem; border-bottom: 1px solid #e5e2da; }
.seksjon { margin-bottom: 1.5rem; }
.seksjon-header { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: #a8a59d; margin-bottom: 0.5rem; }

.prepp-item { background: #fff; border: 0.5px solid #e5e2da; border-radius: 12px; padding: 0.85rem 1rem; margin-bottom: 6px; display: flex; align-items: center; gap: 0.75rem; transition: opacity 0.2s; }
.prepp-item.ferdig { opacity: 0.45; }
.prepp-item input[type=checkbox] { width: 20px; height: 20px; accent-color: #1a1a1a; cursor: pointer; flex-shrink: 0; border-radius: 4px; }
.prepp-tekst { flex: 1; font-size: 0.95rem; line-height: 1.4; color: #1a1a1a; }
.prepp-item.ferdig .prepp-tekst { text-decoration: line-through; }
.item-actions { display: flex; gap: 0.35rem; flex-shrink: 0; }
.btn-edit { background: #eef0f5; border: none; color: #5a6b8c; font-size: 0.9rem; cursor: pointer; padding: 0.35rem 0.55rem; border-radius: 8px; }
.btn-edit:active { background: #1a1a1a; color: #fff; }
.btn-del { background: none; border: none; color: #c4c0b6; font-size: 0.85rem; cursor: pointer; padding: 0.2rem 0.3rem; border-radius: 6px; }
.btn-del:active { color: #1a1a1a; }

.progress-bar { background: #e5e2da; border-radius: 4px; height: 4px; margin-bottom: 1.5rem; overflow: hidden; }
.progress-fill { background: #1a1a1a; height: 100%; border-radius: 4px; transition: width 0.3s; }
.progress-label { font-size: 0.72rem; color: #a8a59d; margin-bottom: 0.5rem; text-align: right; }

.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200; display: flex; align-items: flex-end; justify-content: center; backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
.modal { background: #fff; border-radius: 20px 20px 0 0; padding: 1.5rem 1.25rem; padding-bottom: calc(1.5rem + env(safe-area-inset-bottom)); width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 0.75rem; }
.modal-handle { width: 36px; height: 4px; background: #e5e2da; border-radius: 2px; margin: 0 auto 0.75rem; }
.modal h3 { font-size: 1rem; font-weight: 600; margin-bottom: 0.25rem; color: #1a1a1a; }
.modal input, .modal select { padding: 0.7rem 0.85rem; border: 0.5px solid #e5e2da; border-radius: 10px; font-size: 0.95rem; background: #f7f6f3; color: #1a1a1a; width: 100%; outline: none; }
.modal select option { background: #fff; }
.seksjon-wrap { position: relative; }
.seksjon-forslag { display: none; position: relative; background: #fff; border: 0.5px solid #e5e2da; border-radius: 10px; margin-top: -0.4rem; overflow-y: auto; max-height: 180px; box-shadow: 0 4px 14px rgba(0,0,0,0.08); }
.seksjon-forslag.open { display: block; }
.seksjon-forslag-row { padding: 0.6rem 0.85rem; font-size: 0.88rem; cursor: pointer; border-bottom: 0.5px solid #f0eee8; }
.seksjon-forslag-row:last-child { border-bottom: none; }
.seksjon-forslag-row:active { background: #f7f6f3; }
.modal-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; margin-top: 0.25rem; }
.modal-btns button { padding: 0.8rem; border-radius: 10px; font-size: 0.95rem; font-weight: 600; cursor: pointer; border: none; }
.btn-lagre { background: #1a1a1a; color: #fff; }
.btn-avbryt { background: #f7f6f3; color: #1a1a1a; border: 0.5px solid #e5e2da !important; }

@media print {
  @page { size: A4; margin: 12mm 14mm; }
  body { background: #fff; }
  header, .progress-bar, .progress-label, .item-actions, .modal-overlay { display: none !important; }
  .main { max-width: 100%; padding: 0; }

  .prepp-item.ferdig { display: none !important; }

  .kategori-block { margin-bottom: 0.9rem; }
  .kategori-header { font-size: 0.95rem; margin-bottom: 0.4rem; padding-bottom: 0.25rem; }
  .seksjon { margin-bottom: 0.6rem; }
  .seksjon-header { font-size: 0.62rem; margin-bottom: 0.25rem; }

  .prepp-item { background: none; border: none; border-radius: 0; padding: 0.18rem 0; margin-bottom: 0; gap: 0.5rem; }
  .prepp-item input[type="checkbox"] { -webkit-appearance: none; appearance: none; width: 12px; height: 12px; border: 1px solid #1a1a1a; border-radius: 2px; margin: 0; }
  .prepp-tekst { font-size: 0.78rem; line-height: 1.3; }
}
</style>
</head>
<body>
<header>
  <a href="https://tgillesp-alt.github.io/shopping/prepp-kjokken-hub.html" class="back-btn">‹ Kjøkken MEP</a>
  <div class="header-title" id="header-title">Kjøkken MEP</div>
  <div class="header-actions">
    <button class="btn-sm btn-reset" onclick="window.print()">🖨 Print</button>
    <button class="btn-sm btn-reset" onclick="nullstill()">Nullstill</button>
    <button class="btn-sm btn-add" onclick="apneNy()">+ Legg til</button>
  </div>
</header>

<div class="person-filter" id="person-filter">
  <button class="person-btn active" data-person="alle" onclick="settPerson('alle')">Alle</button>
  <button class="person-btn" data-person="thomas" onclick="settPerson('thomas')">Thomas</button>
  <button class="person-btn" data-person="joakim" onclick="settPerson('joakim')">Joakim</button>
</div>

<div class="main">
  <div class="progress-label" id="progress-label">0 / 0 gjort</div>
  <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
  <div id="liste"></div>
</div>

<div class="modal-overlay" id="modal" style="display:none" onclick="lukkModalOverlay(event)">
  <div class="modal">
    <div class="modal-handle"></div>
    <h3 id="modal-tittel">Legg til punkt</h3>
    <select id="modal-kategori">
      <option value="">Kategori</option>
      <option>FORRETTER</option>
      <option>HOVEDRETTER</option>
      <option>DESSERTER</option>
      <option>DIVERSE</option>
      <option>ANNET</option>
    </select>
    <div class="seksjon-wrap">
      <input type="text" id="modal-seksjon" placeholder="Rett (valgfritt) — skriv navn eller velg fra listen" autocorrect="off" autocapitalize="characters" oninput="visSeksjonForslag()" onfocus="visSeksjonForslag()">
      <div class="seksjon-forslag" id="seksjon-forslag"></div>
    </div>
    <input type="text" id="modal-tekst" placeholder="Beskrivelse *" autocorrect="off">
    <div class="modal-btns">
      <button class="btn-avbryt" onclick="lukkModal()">Avbryt</button>
      <button class="btn-lagre" onclick="lagreItem()">Lagre</button>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://izdclsyuplghwznsjnom.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml6ZGNsc3l1cGxnaHd6bnNqbm9tIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE1MjY5MjksImV4cCI6MjA5NzEwMjkyOX0.GkjxcToCHZrLAm1pVGsBkcLapIOj7uSYd6IcDC0Lyzk';
const SIDE = 'kjokken';
const urlParams = new URLSearchParams(window.location.search);
const TIDSPUNKT = urlParams.get('tidspunkt') || 'kveld';
document.getElementById('header-title').textContent = 'Kjøkken MEP – ' + (TIDSPUNKT === 'lunch' ? 'Lunch' : 'Kveld');

let items = [], editId = null;

async function api(method, path, body) {
  const opts = { method, headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json', 'Prefer': method === 'POST' ? 'return=representation' : '' } };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(SUPABASE_URL + '/rest/v1/' + path, opts);
  if (res.status === 204) return [];
  return res.json();
}

async function hent() {
  items = await api('GET', `prepp?side=eq.${SIDE}&tidspunkt=eq.${TIDSPUNKT}&order=sort_order.asc,created_at.asc&select=*`);
  render();
}

const KATEGORI_ORDER = ['FORRETTER', 'HOVEDRETTER', 'DESSERTER', 'DIVERSE'];
const PERSON_KATEGORIER = {
  thomas: ['FORRETTER', 'DESSERTER', 'DIVERSE'],
  joakim: ['HOVEDRETTER', 'DIVERSE']
};
let aktivPerson = 'alle';

function settPerson(p) {
  aktivPerson = p;
  document.querySelectorAll('.person-btn').forEach(b => b.classList.toggle('active', b.dataset.person === p));
  render();
}

function render() {
  const totalt = items.length;
  const ferdig = items.filter(i => i.ferdig).length;
  const pct = totalt ? Math.round(ferdig / totalt * 100) : 0;
  document.getElementById('progress-label').textContent = `${ferdig} / ${totalt} gjort`;
  document.getElementById('progress-fill').style.width = pct + '%';

  // Seksjoner som skal tvangsplasseres i bestemt kategori
  const SEKSJON_KATEGORI_OVERRIDE = {
    'TARTE TATIN': 'DESSERTER',
    'CRÊPE SUZETTE': 'DESSERTER',
    'CREMEUSE AU CHOCOLAT': 'DESSERTER',
    'COLONEL AU CITRON': 'DESSERTER',
  };
  // Seksjoner som alltid skal vises sist
  const SEKSJON_SIST = ['SMØR SAL'];

  // Group by kategori, then by seksjon within kategori
  const byKategori = {};
  const visibleItems = aktivPerson !== 'alle' ? items.filter(i => !i.ferdig) : items;
  visibleItems.forEach(i => {
    const sek = i.seksjon || 'ANNET';
    const kat = SEKSJON_KATEGORI_OVERRIDE[sek] || i.kategori || 'ANNET';
    if (!byKategori[kat]) byKategori[kat] = {};
    if (!byKategori[kat][sek]) byKategori[kat][sek] = [];
    byKategori[kat][sek].push(i);
  });

  let allKategorier = Object.keys(byKategori);
  if (aktivPerson !== 'alle' && PERSON_KATEGORIER[aktivPerson]) {
    allKategorier = allKategorier.filter(k => PERSON_KATEGORIER[aktivPerson].includes(k));
  }
  const orderedKategorier = [
    ...KATEGORI_ORDER.filter(k => allKategorier.includes(k)),
    ...allKategorier.filter(k => !KATEGORI_ORDER.includes(k))
  ];

  // Sorter seksjoner innen hver kategori — SMØR SAL alltid sist
  orderedKategorier.forEach(kat => {
    const seksjoner = Object.keys(byKategori[kat]);
    const sorted = [
      ...seksjoner.filter(s => !SEKSJON_SIST.includes(s)),
      ...seksjoner.filter(s => SEKSJON_SIST.includes(s))
    ];
    const reordered = {};
    sorted.forEach(s => reordered[s] = byKategori[kat][s]);
    byKategori[kat] = reordered;
  });

  document.getElementById('liste').innerHTML = orderedKategorier.map(kat => `
    <div class="kategori-block">
      <div class="kategori-header">${kat}</div>
      ${Object.entries(byKategori[kat]).map(([seksjon, its]) => `
        <div class="seksjon">
          <div class="seksjon-header">${seksjon}</div>
          ${its.map(i => `
            <div class="prepp-item ${i.ferdig ? 'ferdig' : ''}" id="item-${i.id}">
              <input type="checkbox" ${i.ferdig ? 'checked' : ''} onchange="toggleFerdig('${i.id}', this.checked)">
              <span class="prepp-tekst">${i.tekst}</span>
              <div class="item-actions">
                <button class="btn-edit" onclick="apneRediger('${i.id}')">✏️ Rediger</button>
                <button class="btn-del" onclick="slett('${i.id}')">✕</button>
              </div>
            </div>
          `).join('')}
        </div>
      `).join('')}
    </div>
  `).join('');
}

async function toggleFerdig(id, ferdig) {
  await api('PATCH', `prepp?id=eq.${id}`, { ferdig });
  hent();
}

async function slett(id) {
  if (!confirm('Slett dette punktet?')) return;
  await api('DELETE', `prepp?id=eq.${id}`);
  hent();
}

async function nullstill() {
  if (!confirm('Nullstill alle kryss?')) return;
  await api('PATCH', `prepp?side=eq.${SIDE}&tidspunkt=eq.${TIDSPUNKT}`, { ferdig: false });
  hent();
}

function apneNy() {
  editId = null;
  document.getElementById('modal-tittel').textContent = 'Legg til punkt';
  document.getElementById('modal-seksjon').value = '';
  skjulSeksjonForslag();
  document.getElementById('modal-kategori').value = '';
  document.getElementById('modal-tekst').value = '';
  document.getElementById('modal').style.display = 'flex';
  setTimeout(() => document.getElementById('modal-tekst').focus(), 100);
}

function apneRediger(id) {
  const item = items.find(i => i.id === id);
  if (!item) return;
  editId = id;
  document.getElementById('modal-tittel').textContent = 'Rediger punkt';
  document.getElementById('modal-kategori').value = item.kategori || '';
  document.getElementById('modal-seksjon').value = item.seksjon || '';
  skjulSeksjonForslag();
  document.getElementById('modal-tekst').value = item.tekst;
  document.getElementById('modal').style.display = 'flex';
  setTimeout(() => document.getElementById('modal-tekst').focus(), 100);
}

async function lagreItem() {
  const tekst = document.getElementById('modal-tekst').value.trim();
  const kategori = document.getElementById('modal-kategori').value || null;
  const seksjon = document.getElementById('modal-seksjon').value.trim().toUpperCase() || null;
  if (!tekst) { alert('Skriv inn beskrivelse'); return; }
  if (editId) {
    const gammeltItem = items.find(i => i.id === editId);
    const gammelSeksjon = gammeltItem?.seksjon;
    // Oppdater selve punktet
    await api('PATCH', `prepp?id=eq.${editId}`, { tekst, kategori, seksjon });
    // Hvis seksjonsnavnet er endret, oppdater alle andre punkter i samme seksjon
    if (gammelSeksjon && seksjon && gammelSeksjon !== seksjon) {
      const andreIds = items
        .filter(i => i.id !== editId && i.seksjon === gammelSeksjon && i.tidspunkt === TIDSPUNKT)
        .map(i => i.id);
      for (const id of andreIds) {
        await api('PATCH', `prepp?id=eq.${id}`, { seksjon });
      }
    }
  } else {
    await api('POST', 'prepp', { side: SIDE, tidspunkt: TIDSPUNKT, kategori, seksjon, tekst, ferdig: false });
  }
  lukkModal();
  hent();
}

function visSeksjonForslag() {
  const q = document.getElementById('modal-seksjon').value.trim().toLowerCase();
  const box = document.getElementById('seksjon-forslag');
  const alleSeksjoner = [...new Set(items.map(i => i.seksjon).filter(Boolean))].sort();
  const treff = (q ? alleSeksjoner.filter(s => s.toLowerCase().includes(q)) : alleSeksjoner).slice(0, 8);
  if (!treff.length) { box.classList.remove('open'); box.innerHTML = ''; return; }
  box.innerHTML = treff.map(s => `<div class="seksjon-forslag-row" onmousedown="event.preventDefault(); velgSeksjon('${s.replace(/'/g, "\\'")}')">${s}</div>`).join('');
  box.classList.add('open');
}
function skjulSeksjonForslag() {
  const box = document.getElementById('seksjon-forslag');
  box.classList.remove('open');
  box.innerHTML = '';
}
function velgSeksjon(navn) {
  document.getElementById('modal-seksjon').value = navn;
  skjulSeksjonForslag();
}
function lukkModal() { document.getElementById('modal').style.display = 'none'; editId = null; }
function lukkModalOverlay(e) { if (e.target === document.getElementById('modal')) lukkModal(); }

window.addEventListener('beforeprint', () => {
  document.querySelectorAll('.seksjon').forEach(sek => {
    const synlige = sek.querySelectorAll('.prepp-item:not(.ferdig)').length;
    sek.style.display = synlige === 0 ? 'none' : '';
  });
  document.querySelectorAll('.kategori-block').forEach(kat => {
    const synlige = kat.querySelectorAll('.prepp-item:not(.ferdig)').length;
    kat.style.display = synlige === 0 ? 'none' : '';
  });
});
window.addEventListener('afterprint', () => {
  document.querySelectorAll('.seksjon, .kategori-block').forEach(el => el.style.display = '');
});

hent();
setInterval(hent, 20000);
</script>
</body>
</html>
