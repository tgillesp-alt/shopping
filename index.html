<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="manifest.json">
<title>Fager Bistro</title>
<style>
:root {
  --bg: #f7f6f3;
  --card: #ffffff;
  --dark: #111110;
  --muted: #8a8a85;
  --border: #e8e6e0;
  --accent: #111110;
  --warn: #e05c3a;
  --success: #2d8a4e;
  --radius: 14px;
  --radius-sm: 10px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', sans-serif; background: var(--bg); color: var(--dark); min-height: 100vh; }

/* LOGIN */
#login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 2rem 1.5rem; background: var(--bg); }
#login-box { width: 100%; max-width: 360px; }
.login-logo { font-size: 1.1rem; font-weight: 600; color: var(--dark); letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 0.4rem; }
.login-sub { font-size: 0.8rem; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 2.5rem; }
.bruker-valg { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; margin-bottom: 1rem; }
.bruker-btn { padding: 0.8rem; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--card); color: var(--dark); font-size: 0.95rem; cursor: pointer; transition: all 0.15s; }
.bruker-btn.valgt { background: var(--dark); color: #fff; border-color: var(--dark); font-weight: 500; }
#login-passord { width: 100%; padding: 0.85rem 1rem; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--card); color: var(--dark); font-size: 1rem; margin-bottom: 0.75rem; outline: none; }
#login-passord::placeholder { color: #b8b4ab; }
#login-btn { width: 100%; padding: 0.9rem; background: var(--dark); color: #fff; border: none; border-radius: var(--radius-sm); font-size: 1rem; font-weight: 600; cursor: pointer; letter-spacing: 0.02em; }
#login-error { color: #c0392b; font-size: 0.82rem; margin-top: 0.5rem; display: none; text-align: center; }

/* APP */
#app { display: none; }

header { background: var(--dark); color: #fff; padding: 0.9rem 1.25rem; padding-top: calc(0.9rem + env(safe-area-inset-top)); display: flex; align-items: center; gap: 0.5rem; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
.header-title { font-size: 0.78rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; }
.header-user { font-size: 0.75rem; color: rgba(255,255,255,0.4); }

/* TABS */
.tabs { display: flex; background: var(--card); border-bottom: 1px solid var(--border); padding: 0 1rem; gap: 0; overflow-x: auto; }
.tabs::-webkit-scrollbar { display: none; }
.tab { padding: 0.85rem 1rem; font-size: 0.82rem; font-weight: 500; cursor: pointer; border-bottom: 2px solid transparent; color: var(--muted); white-space: nowrap; flex-shrink: 0; letter-spacing: 0.02em; transition: color 0.15s; display: flex; align-items: center; gap: 0.4rem; }
.tab.active { color: var(--dark); border-bottom-color: var(--dark); }
.badge { background: var(--dark); color: #fff; border-radius: 20px; font-size: 0.68rem; font-weight: 600; padding: 0.15rem 0.45rem; min-width: 20px; text-align: center; }
.tab.active .badge { background: var(--dark); }
.tab:not(.active) .badge { background: #d5d3cc; color: #666; }

/* TOOLBAR */
.toolbar { padding: 0.65rem 1rem; background: var(--card); border-bottom: 1px solid var(--border); display: flex; gap: 0.5rem; overflow-x: auto; }
.toolbar::-webkit-scrollbar { display: none; }
.toolbar select, .toolbar input[type=text] { padding: 0.45rem 0.65rem; border: 1px solid var(--border); border-radius: 8px; font-size: 0.82rem; background: var(--bg); color: var(--dark); flex-shrink: 0; outline: none; }
.toolbar select { max-width: 145px; }
.toolbar input { width: 100px; }

/* MAIN */
.main { padding: 1rem 1rem; padding-bottom: calc(1rem + env(safe-area-inset-bottom)); max-width: 680px; margin: 0 auto; }

/* ADD FORM */
.add-form { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.1rem; margin-bottom: 1.25rem; display: flex; flex-direction: column; gap: 0.55rem; }
.add-form input, .add-form select { padding: 0.7rem 0.85rem; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 0.95rem; background: var(--bg); color: var(--dark); width: 100%; outline: none; transition: border-color 0.15s; }
.add-form input:focus, .add-form select:focus { border-color: #999; }
.add-form .row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.55rem; }
.add-btn { padding: 0.8rem; background: var(--dark); color: #fff; border: none; border-radius: var(--radius-sm); font-size: 0.95rem; font-weight: 600; cursor: pointer; letter-spacing: 0.02em; transition: opacity 0.15s; }
.add-btn:active { opacity: 0.8; }

/* SECTION */
.section-label { font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin: 1.1rem 0 0.5rem 0.1rem; }

/* VARE */
.vare { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 0.9rem 1rem; margin-bottom: 0.45rem; display: flex; align-items: center; gap: 0.75rem; transition: opacity 0.2s; }
.vare.bestilt { opacity: 0.5; }
.vare.mottatt { opacity: 0.28; }

.vare-checks { display: flex; flex-direction: column; gap: 0.55rem; flex-shrink: 0; }
.check-wrap { display: flex; align-items: center; gap: 0.35rem; cursor: pointer; }
.check-wrap input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--dark); cursor: pointer; flex-shrink: 0; border-radius: 4px; }
.check-wrap span { font-size: 0.72rem; color: var(--muted); font-weight: 500; }

.vare-body { flex: 1; min-width: 0; }
.vare-navn { font-size: 0.95rem; font-weight: 500; word-break: break-word; cursor: pointer; display: flex; align-items: center; gap: 0.3rem; }
.warn-icon { color: var(--warn); font-size: 0.85rem; flex-shrink: 0; }
.vare-tags { display: flex; gap: 0.3rem; flex-wrap: wrap; margin-top: 0.35rem; }
.tag { font-size: 0.68rem; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 0.15rem 0.4rem; color: var(--muted); font-weight: 500; }
.tag.lev { background: #f0f0ec; border-color: #ddddd8; color: #555; }

.vare-del { background: none; border: none; color: #ccc; cursor: pointer; font-size: 1rem; padding: 0.35rem; flex-shrink: 0; line-height: 1; border-radius: 6px; transition: all 0.15s; }
.vare-del:active { color: var(--warn); background: #fef2ee; }

.empty { text-align: center; color: #bbb; font-size: 0.9rem; padding: 3rem 0; }
.hist-toolbar { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
.hist-toolbar input { flex: 1; padding: 0.7rem 0.85rem; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 0.95rem; background: var(--bg); outline: none; }
.hist-toolbar select { padding: 0.7rem 0.75rem; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 0.9rem; background: var(--bg); outline: none; }
.hist-item { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 0.85rem 1rem; margin-bottom: 0.45rem; }
.hist-navn { font-size: 0.95rem; font-weight: 500; margin-bottom: 0.35rem; }
.hist-tags { display: flex; gap: 0.3rem; flex-wrap: wrap; }

/* MODAL */
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200; display: flex; align-items: flex-end; justify-content: center; backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
.modal { background: var(--card); border-radius: 20px 20px 0 0; padding: 1.5rem 1.25rem; padding-bottom: calc(1.5rem + env(safe-area-inset-bottom)); width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 0.6rem; }
.modal-handle { width: 36px; height: 4px; background: #ddd; border-radius: 2px; margin: 0 auto 1rem; }
.modal h3 { font-size: 1rem; font-weight: 600; margin-bottom: 0.25rem; }
.modal input, .modal select { padding: 0.7rem 0.85rem; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 0.95rem; background: var(--bg); color: var(--dark); width: 100%; outline: none; }
.modal .row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; }
.modal-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; margin-top: 0.35rem; }
.modal-btns button { padding: 0.8rem; border-radius: var(--radius-sm); font-size: 0.95rem; font-weight: 600; cursor: pointer; border: none; }
.btn-lagre { background: var(--dark); color: #fff; }
.btn-avbryt { background: var(--bg); color: var(--dark); border: 1px solid var(--border) !important; }
</style>
</head>

<script>
const SUPABASE_URL = 'https://izdclsyuplghwznsjnom.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml6ZGNsc3l1cGxnaHd6bnNqbm9tIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE1MjY5MjksImV4cCI6MjA5NzEwMjkyOX0.GkjxcToCHZrLAm1pVGsBkcLapIOj7uSYd6IcDC0Lyzk';
const WORKER_URL = 'https://fager-push.thomas-0e8.workers.dev';
const VAPID_PUBLIC = 'BBugd5BD_AJbVUv9lfD-2tfp3apULExDnMQ8xVQZ9oUMmG8nUXwG-ADhCojwp4DDMI3XybLCIBe_951RA5_PHUs';
const PASSORD = 'fager2026';
const KAT_ORDER = ['Kjøtt','Fugl','Fisk & Fond','Frukt & Grønt','Ost','Hygiene & Forbruksmateriell','Annet','Vin','Sprit','Øl','Mineralvann'];
const VARSLE = ['Thomas','Marcus'];

let bruker = '', varer = [], aktivTab = 'aktive', redigerId = null;

const fmt = d => d ? new Date(d).toLocaleString('no-NO',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}) : null;

function velgBruker(navn, el) {
  bruker = navn;
  document.querySelectorAll('.bruker-btn').forEach(b => b.classList.remove('valgt'));
  el.classList.add('valgt');
}

function loggInn() {
  if (!bruker) { alert('Velg navn'); return; }
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('header-bruker').textContent = bruker;
  hent();
  setInterval(hent, 15000);
  if (VARSLE.includes(bruker)) registrerPush();
}

async function api(method, path, body) {
  const opts = { method, headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json', 'Prefer': method === 'POST' ? 'return=representation' : '' } };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(SUPABASE_URL + '/rest/v1/' + path, opts);
  if (res.status === 204) return [];
  return res.json();
}

async function hent() {
  varer = await api('GET', 'varer?order=created_at.desc&select=*');
  render();
}

function byttTab(tab, el) {
  aktivTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('liste').style.display = tab === 'historikk' ? 'none' : 'block';
  document.getElementById('historikk-view').style.display = tab === 'historikk' ? 'block' : 'none';
  if (tab === 'historikk') renderHistorikk(); else render();
}

function render() {
  const fKat = document.getElementById('f-kat').value;
  const fLev = document.getElementById('f-lev').value;
  const sok = document.getElementById('f-sok').value.toLowerCase();
  const aktive = varer.filter(v => !v.bestilt && !v.mottatt);
  const bestilt = varer.filter(v => v.bestilt && !v.mottatt);
  const mottatt = varer.filter(v => v.mottatt);
  document.getElementById('c-aktive').textContent = aktive.length;
  document.getElementById('c-bestilt').textContent = bestilt.length;
  document.getElementById('c-mottatt').textContent = mottatt.length;
  let vis = aktivTab === 'aktive' ? aktive : aktivTab === 'bestilt' ? bestilt : mottatt;
  if (fKat) vis = vis.filter(v => v.kategori === fKat);
  if (fLev) vis = vis.filter(v => v.leverandor === fLev);
  if (sok) vis = vis.filter(v => v.navn.toLowerCase().includes(sok));
  const grouped = {};
  vis.forEach(v => { const k = v.kategori || 'Annet'; if (!grouped[k]) grouped[k] = []; grouped[k].push(v); });
  const container = document.getElementById('liste');
  if (!vis.length) { container.innerHTML = '<div class="empty">Ingen varer</div>'; return; }
  container.innerHTML = Object.entries(grouped)
    .sort((a,b) => { const ai=KAT_ORDER.indexOf(a[0]),bi=KAT_ORDER.indexOf(b[0]); return (ai===-1?99:ai)-(bi===-1?99:bi); })
    .map(([group, items]) => `
      <div class="section-label">${group}</div>
      ${items.map(v => {
        const cls = v.mottatt ? 'mottatt' : v.bestilt ? 'bestilt' : '';
        const ageH = (Date.now() - new Date(v.created_at)) / 36e5;
        const bestiltAgeH = v.bestilt_dato ? (Date.now() - new Date(v.bestilt_dato)) / 36e5 : 0;
        const warn = !v.bestilt && !v.mottatt && ageH > 12;
        const warnMottatt = v.bestilt && !v.mottatt && bestiltAgeH > 24;
        const tags = [
          v.leverandor ? `<span class="tag lev">${v.leverandor}</span>` : '',
          v.mengde ? `<span class="tag">${v.mengde}${v.enhet ? ' '+v.enhet : ''}</span>` : '',
          v.lagt_inn_av ? `<span class="tag">av ${v.lagt_inn_av}</span>` : '',
          v.created_at ? `<span class="tag">${fmt(v.created_at)}</span>` : '',
          v.bestilt_dato ? `<span class="tag">bestilt ${fmt(v.bestilt_dato)}</span>` : '',
          v.mottatt_dato ? `<span class="tag">mottatt ${fmt(v.mottatt_dato)}</span>` : '',
        ].filter(Boolean).join('');
        return `<div class="vare ${cls}">
          <div class="vare-checks">
            <label class="check-wrap"><input type="checkbox" ${v.bestilt||v.mottatt?'checked':''} onchange="toggleBestilt('${v.id}',this.checked)"><span>Bestilt</span></label>
            <label class="check-wrap"><input type="checkbox" ${v.mottatt?'checked':''} onchange="toggleMottatt('${v.id}',this.checked)"><span>Mottatt</span></label>
          </div>
          <div class="vare-body">
            <div class="vare-navn" onclick="redigerVare('${v.id}')">
              ${warn ? '<span class="warn-icon">⚠️</span>' : ''}${warnMottatt ? '<span class="warn-icon">🕐</span>' : ''}${v.navn}
            </div>
            <div class="vare-tags">${tags}</div>
          </div>
          <button class="vare-del" onclick="slett('${v.id}')">✕</button>
        </div>`;
      }).join('')}
    `).join('');
}

async function leggTil() {
  const navn = document.getElementById('ny-navn').value.trim();
  const kat = document.getElementById('ny-kat').value;
  if (!navn || !kat) { alert('Fyll inn varenavn og kategori'); return; }
  await api('POST', 'varer', {
    navn, kategori: kat,
    leverandor: document.getElementById('ny-lev').value || null,
    mengde: document.getElementById('ny-mengde').value || null,
    enhet: document.getElementById('ny-enhet').value || null,
    lagt_inn_av: bruker, bestilt: false, mottatt: false
  });
  document.getElementById('ny-navn').value = '';
  document.getElementById('ny-mengde').value = '';
  document.getElementById('ny-enhet').value = '';
  hent();
  fetch(`${WORKER_URL}/notify`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({fra:bruker,vare:navn,kategori:kat}) }).catch(()=>{});
}

async function toggleBestilt(id, checked) {
  await api('PATCH', `varer?id=eq.${id}`, { bestilt: checked, bestilt_dato: checked ? new Date().toISOString() : null });
  hent();
}

async function toggleMottatt(id, checked) {
  const now = new Date().toISOString();
  await api('PATCH', `varer?id=eq.${id}`, { mottatt: checked, mottatt_dato: checked ? now : null, bestilt: checked ? true : undefined, bestilt_dato: checked ? now : undefined });
  hent();
}

async function slett(id) {
  if (!confirm('Slett?')) return;
  await api('DELETE', `varer?id=eq.${id}`);
  hent();
}

function redigerVare(id) {
  const v = varer.find(v => v.id === id);
  if (!v) return;
  redigerId = id;
  document.getElementById('edit-navn').value = v.navn || '';
  document.getElementById('edit-kat').value = v.kategori || '';
  document.getElementById('edit-lev').value = v.leverandor || '';
  document.getElementById('edit-mengde').value = v.mengde || '';
  document.getElementById('edit-enhet').value = v.enhet || '';
  document.getElementById('edit-modal').style.display = 'flex';
}

function lukkModal() { document.getElementById('edit-modal').style.display = 'none'; redigerId = null; }
function lukkModalOverlay(e) { if (e.target === document.getElementById('edit-modal')) lukkModal(); }

async function lagreRedigert() {
  const navn = document.getElementById('edit-navn').value.trim();
  const kat = document.getElementById('edit-kat').value;
  if (!navn || !kat) { alert('Fyll inn varenavn og kategori'); return; }
  await api('PATCH', `varer?id=eq.${redigerId}`, {
    navn, kategori: kat,
    leverandor: document.getElementById('edit-lev').value || null,
    mengde: document.getElementById('edit-mengde').value || null,
    enhet: document.getElementById('edit-enhet').value || null,
  });
  lukkModal();
  hent();
}

function urlBase64ToUint8Array(b) {
  const p = '='.repeat((4-b.length%4)%4);
  const base64 = (b+p).replace(/-/g,'+').replace(/_/g,'/');
  return Uint8Array.from([...atob(base64)].map(c=>c.charCodeAt(0)));
}

async function registrerPush() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;
  try {
    const reg = await navigator.serviceWorker.register('/shopping/sw.js');
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') return;
    const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC) });
    const s = sub.toJSON();
    await fetch(`${WORKER_URL}/subscribe`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({endpoint:s.endpoint,keys:s.keys,bruker}) });
  } catch(e) { console.log('Push ikke tilgjengelig:', e); }
}


function renderHistorikk() {
  const sok = (document.getElementById('hist-sok').value || '').toLowerCase();
  const gruppe = document.getElementById('hist-gruppe').value;
  let data = varer.filter(v => v.mottatt);
  if (sok) data = data.filter(v =>
    v.navn.toLowerCase().includes(sok) ||
    (v.kategori||'').toLowerCase().includes(sok) ||
    (v.leverandor||'').toLowerCase().includes(sok)
  );
  data.sort((a,b) => new Date(b.mottatt_dato||b.created_at) - new Date(a.mottatt_dato||a.created_at));
  const grouped = {};
  data.forEach(v => {
    const key = (gruppe === 'leverandor' ? v.leverandor : v.kategori) || 'Ukjent';
    if (!grouped[key]) grouped[key] = [];
    grouped[key].push(v);
  });
  const container = document.getElementById('hist-liste');
  if (!data.length) { container.innerHTML = '<div class="empty">Ingen historikk</div>'; return; }
  container.innerHTML = Object.entries(grouped).sort((a,b)=>a[0].localeCompare(b[0])).map(([group, items]) => `
    <div class="section-label">${group}</div>
    ${items.map(v => `
      <div class="hist-item">
        <div class="hist-navn">${v.navn}</div>
        <div class="hist-tags">
          ${v.leverandor ? `<span class="tag lev">${v.leverandor}</span>` : ''}
          ${v.kategori ? `<span class="tag">${v.kategori}</span>` : ''}
          ${v.mengde ? `<span class="tag">${v.mengde}${v.enhet?' '+v.enhet:''}</span>` : ''}
          ${v.lagt_inn_av ? `<span class="tag">av ${v.lagt_inn_av}</span>` : ''}
          ${v.created_at ? `<span class="tag">lagt inn ${fmt(v.created_at)}</span>` : ''}
          ${v.bestilt_dato ? `<span class="tag">bestilt ${fmt(v.bestilt_dato)}</span>` : ''}
          ${v.mottatt_dato ? `<span class="tag">mottatt ${fmt(v.mottatt_dato)}</span>` : ''}
        </div>
      </div>`).join('')}
  `).join('');
}
