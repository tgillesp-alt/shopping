<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fager Bistro – Handleliste</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f4f0; color: #1a1a18; min-height: 100vh; }

  header { background: #1a1a18; color: #f5f4f0; padding: 1rem 1.5rem; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
  header h1 { font-size: 1rem; font-weight: 500; letter-spacing: 0.05em; text-transform: uppercase; }
  header span { font-size: 0.8rem; opacity: 0.5; }

  #login-screen { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #f5f4f0; }
  #login-box { background: #fff; border: 0.5px solid #ddd; border-radius: 12px; padding: 2rem; width: 320px; }
  #login-box h2 { font-size: 1rem; font-weight: 500; margin-bottom: 1.5rem; }
  #login-box input { width: 100%; padding: 0.6rem 0.8rem; border: 0.5px solid #ccc; border-radius: 8px; font-size: 0.95rem; margin-bottom: 1rem; }
  #login-box button { width: 100%; padding: 0.65rem; background: #1a1a18; color: #fff; border: none; border-radius: 8px; font-size: 0.95rem; cursor: pointer; }
  #login-error { color: #c0392b; font-size: 0.85rem; margin-top: 0.5rem; display: none; }

  #app { display: none; }

  .toolbar { padding: 1rem 1.5rem; background: #fff; border-bottom: 0.5px solid #e0ddd6; display: flex; gap: 0.75rem; flex-wrap: wrap; align-items: center; }
  .toolbar select, .toolbar input[type=text] { padding: 0.45rem 0.7rem; border: 0.5px solid #ccc; border-radius: 8px; font-size: 0.9rem; background: #fff; }
  .toolbar select { min-width: 160px; }
  .filter-label { font-size: 0.8rem; color: #888; margin-right: -0.25rem; }

  .tabs { display: flex; gap: 0; padding: 0 1.5rem; background: #fff; border-bottom: 0.5px solid #e0ddd6; }
  .tab { padding: 0.7rem 1rem; font-size: 0.85rem; cursor: pointer; border-bottom: 2px solid transparent; color: #888; white-space: nowrap; }
  .tab.active { color: #1a1a18; border-bottom-color: #1a1a18; font-weight: 500; }

  .main { padding: 1.5rem; max-width: 900px; margin: 0 auto; }

  .add-form { background: #fff; border: 0.5px solid #e0ddd6; border-radius: 12px; padding: 1.25rem; margin-bottom: 1.5rem; display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
  .add-form input, .add-form select { padding: 0.5rem 0.75rem; border: 0.5px solid #ccc; border-radius: 8px; font-size: 0.9rem; width: 100%; }
  .add-form .full { grid-column: 1 / -1; }
  .add-form button { grid-column: 1 / -1; padding: 0.65rem; background: #1a1a18; color: #fff; border: none; border-radius: 8px; font-size: 0.95rem; cursor: pointer; }
  .add-form button:hover { background: #333; }
  .form-title { grid-column: 1 / -1; font-size: 0.85rem; font-weight: 500; color: #555; margin-bottom: 0.25rem; }

  .section { margin-bottom: 1.5rem; }
  .section-header { font-size: 0.75rem; font-weight: 500; text-transform: uppercase; letter-spacing: 0.08em; color: #888; margin-bottom: 0.5rem; padding: 0 0.25rem; }

  .vare { background: #fff; border: 0.5px solid #e0ddd6; border-radius: 10px; padding: 0.85rem 1rem; margin-bottom: 0.5rem; display: flex; align-items: center; gap: 0.75rem; transition: opacity 0.2s; }
  .vare.bestilt { opacity: 0.5; }
  .vare.mottatt { opacity: 0.3; text-decoration: line-through; }

  .vare-check { display: flex; flex-direction: column; gap: 0.3rem; }
  .vare-check label { display: flex; align-items: center; gap: 0.4rem; font-size: 0.75rem; color: #888; cursor: pointer; white-space: nowrap; }
  .vare-check input[type=checkbox] { width: 15px; height: 15px; cursor: pointer; accent-color: #1a1a18; }

  .vare-info { flex: 1; }
  .vare-navn { font-size: 0.95rem; font-weight: 500; }
  .vare-meta { font-size: 0.78rem; color: #999; margin-top: 0.2rem; display: flex; gap: 0.5rem; flex-wrap: wrap; }
  .vare-meta span { background: #f0efe9; border-radius: 4px; padding: 0.1rem 0.4rem; }

  .vare-del { background: none; border: none; color: #bbb; cursor: pointer; font-size: 1rem; padding: 0.25rem; line-height: 1; }
  .vare-del:hover { color: #c0392b; }

  .empty { text-align: center; color: #aaa; font-size: 0.9rem; padding: 3rem 0; }

  .badge-count { background: #1a1a18; color: #fff; border-radius: 10px; font-size: 0.7rem; padding: 0.1rem 0.4rem; margin-left: 0.4rem; }

  @media (max-width: 600px) {
    .add-form { grid-template-columns: 1fr; }
    .add-form .full { grid-column: 1; }
    .add-form button { grid-column: 1; }
    .toolbar { gap: 0.5rem; }
    .toolbar select { min-width: 130px; }
  }
</style>
</head>
<body>

<div id="login-screen">
  <div id="login-box">
    <h2>Fager Bistro — Handleliste</h2>
    <input type="text" id="login-navn" placeholder="Ditt navn" autocomplete="off">
    <input type="password" id="login-passord" placeholder="Passord">
    <button onclick="loggInn()">Logg inn</button>
    <div id="login-error">Feil passord</div>
  </div>
</div>

<div id="app">
  <header>
    <h1>Fager Bistro — Handleliste</h1>
    <span id="header-bruker"></span>
  </header>

  <div class="tabs">
    <div class="tab active" onclick="byttTab('aktive', this)">Aktive <span class="badge-count" id="count-aktive">0</span></div>
    <div class="tab" onclick="byttTab('bestilt', this)">Bestilt <span class="badge-count" id="count-bestilt">0</span></div>
    <div class="tab" onclick="byttTab('mottatt', this)">Mottatt <span class="badge-count" id="count-mottatt">0</span></div>
  </div>

  <div class="toolbar">
    <span class="filter-label">Filtrer:</span>
    <select id="filter-lev" onchange="render()">
      <option value="">Alle leverandører</option>
      <option>Langdalen</option>
      <option>Frukt Engros</option>
      <option>Laks & Vilt</option>
      <option>Annis Pølsemakeri</option>
      <option>Strøm Larsen</option>
      <option>Fromageriet</option>
      <option>Arnestad</option>
      <option>Drikke & Vin</option>
      <option>Annet</option>
    </select>
    <select id="filter-kat" onchange="render()">
      <option value="">Alle kategorier</option>
      <option>Frukt & Grønt</option>
      <option>Fisk & Fond</option>
      <option>Fugl</option>
      <option>Kjøtt</option>
      <option>Ost</option>
      <option>Vin</option>
      <option>Sprit</option>
      <option>Øl</option>
      <option>Mineralvann</option>
      <option>Hygiene & Forbruksmateriell</option>
      <option>Annet</option>
    </select>
    <input type="text" id="filter-sok" placeholder="Søk..." oninput="render()" style="width:140px;">
  </div>

  <div class="main">
    <div class="add-form">
      <div class="form-title">Legg til vare</div>
      <input type="text" id="ny-navn" placeholder="Varenavn *" class="full">
      <select id="ny-kat">
        <option value="">Kategori *</option>
        <option>Frukt & Grønt</option>
        <option>Fisk & Fond</option>
        <option>Fugl</option>
        <option>Kjøtt</option>
        <option>Ost</option>
        <option>Vin</option>
        <option>Sprit</option>
        <option>Øl</option>
        <option>Mineralvann</option>
        <option>Hygiene & Forbruksmateriell</option>
        <option>Annet</option>
      </select>
      <select id="ny-lev">
        <option value="">Leverandør (valgfritt)</option>
        <option>Langdalen</option>
        <option>Frukt Engros</option>
        <option>Laks & Vilt</option>
        <option>Annis Pølsemakeri</option>
        <option>Strøm Larsen</option>
        <option>Fromageriet</option>
        <option>Arnestad</option>
        <option>Drikke & Vin</option>
        <option>Annet</option>
      </select>
      <input type="text" id="ny-mengde" placeholder="Mengde (f.eks. 2)">
      <input type="text" id="ny-enhet" placeholder="Enhet (f.eks. kg, stk)">
      <button onclick="leggTil()">+ Legg til</button>
    </div>
    <div id="liste"></div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://izdclsyuplghwznsjnom.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml6ZGNsc3l1cGxnaHd6bnNqbm9tIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE1MjY5MjksImV4cCI6MjA5NzEwMjkyOX0.GkjxcToCHZrLAm1pVGsBkcLapIOj7uSYd6IcDC0Lyzk';
const PASSORD = 'fager2026';

let bruker = '';
let varer = [];
let aktivTab = 'aktive';

function loggInn() {
  const navn = document.getElementById('login-navn').value.trim();
  const passord = document.getElementById('login-passord').value;
  if (passord !== PASSORD) {
    document.getElementById('login-error').style.display = 'block';
    return;
  }
  if (!navn) { alert('Skriv inn navn'); return; }
  bruker = navn;
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('header-bruker').textContent = bruker;
  hent();
  setInterval(hent, 15000);
}

async function api(method, path, body) {
  const opts = {
    method,
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': 'Bearer ' + SUPABASE_KEY,
      'Content-Type': 'application/json',
      'Prefer': method === 'POST' ? 'return=representation' : ''
    }
  };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(SUPABASE_URL + '/rest/v1/' + path, opts);
  if (res.status === 204) return [];
  return res.json();
}

async function hent() {
  varer = await api('GET', 'varer?order=created_at.desc&select=*');
  render();
}

function byttTab(tab, el) {
  aktivTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  render();
}

function render() {
  const filterLev = document.getElementById('filter-lev').value;
  const filterKat = document.getElementById('filter-kat').value;
  const sok = document.getElementById('filter-sok').value.toLowerCase();

  const aktive = varer.filter(v => !v.bestilt && !v.mottatt);
  const bestilt = varer.filter(v => v.bestilt && !v.mottatt);
  const mottatt = varer.filter(v => v.mottatt);

  document.getElementById('count-aktive').textContent = aktive.length;
  document.getElementById('count-bestilt').textContent = bestilt.length;
  document.getElementById('count-mottatt').textContent = mottatt.length;

  let vis = aktivTab === 'aktive' ? aktive : aktivTab === 'bestilt' ? bestilt : mottatt;

  if (filterLev) vis = vis.filter(v => v.leverandor === filterLev);
  if (filterKat) vis = vis.filter(v => v.kategori === filterKat);
  if (sok) vis = vis.filter(v => v.navn.toLowerCase().includes(sok));

  const grouped = {};
  vis.forEach(v => {
    const key = v.leverandor || v.kategori || 'Ukategorisert';
    if (!grouped[key]) grouped[key] = [];
    grouped[key].push(v);
  });

  const KATEGORI_ORDER = ['Kjøtt','Fugl','Fisk & Fond','Frukt & Grønt','Ost','Hygiene & Forbruksmateriell','Annet','Vin','Sprit','Øl','Mineralvann'];
  const container = document.getElementById('liste');
  if (vis.length === 0) {
    container.innerHTML = '<div class="empty">Ingen varer</div>';
    return;
  }

  container.innerHTML = Object.entries(grouped).sort((a,b) => {
    const ai = KATEGORI_ORDER.indexOf(a[0]);
    const bi = KATEGORI_ORDER.indexOf(b[0]);
    return (ai === -1 ? 99 : ai) - (bi === -1 ? 99 : bi);
  }).map(([group, items]) => `
    <div class="section">
      <div class="section-header">${group}</div>
      ${items.map(v => vareHTML(v)).join('')}
    </div>
  `).join('');
}

function vareHTML(v) {
  const cls = v.mottatt ? 'mottatt' : v.bestilt ? 'bestilt' : '';
  const meta = [v.kategori, v.mengde ? v.mengde + (v.enhet ? ' ' + v.enhet : '') : '', v.lagt_inn_av ? 'av ' + v.lagt_inn_av : ''].filter(Boolean);
  return `
    <div class="vare ${cls}" id="vare-${v.id}">
      <div class="vare-check">
        <label><input type="checkbox" ${v.bestilt || v.mottatt ? 'checked' : ''} onchange="toggleBestilt('${v.id}', this.checked)"> Bestilt</label>
        <label><input type="checkbox" ${v.mottatt ? 'checked' : ''} onchange="toggleMottatt('${v.id}', this.checked)"> Mottatt</label>
      </div>
      <div class="vare-info">
        <div class="vare-navn">${v.navn}</div>
        <div class="vare-meta">${meta.map(m => `<span>${m}</span>`).join('')}</div>
      </div>
      <button class="vare-del" onclick="slett('${v.id}')" title="Slett">✕</button>
    </div>
  `;
}

async function leggTil() {
  const navn = document.getElementById('ny-navn').value.trim();
  const kat = document.getElementById('ny-kat').value;
  if (!navn || !kat) { alert('Fyll inn varenavn og kategori'); return; }
  await api('POST', 'varer', {
    navn,
    kategori: kat,
    leverandor: document.getElementById('ny-lev').value || null,
    mengde: document.getElementById('ny-mengde').value || null,
    enhet: document.getElementById('ny-enhet').value || null,
    lagt_inn_av: bruker,
    bestilt: false,
    mottatt: false
  });
  document.getElementById('ny-navn').value = '';
  document.getElementById('ny-mengde').value = '';
  document.getElementById('ny-enhet').value = '';
  hent();
}

async function toggleBestilt(id, checked) {
  await api('PATCH', `varer?id=eq.${id}`, { bestilt: checked, mottatt: checked ? false : undefined });
  hent();
}

async function toggleMottatt(id, checked) {
  await api('PATCH', `varer?id=eq.${id}`, { mottatt: checked, bestilt: checked ? true : undefined });
  hent();
}

async function slett(id) {
  if (!confirm('Slett denne varen?')) return;
  await api('DELETE', `varer?id=eq.${id}`);
  hent();
}

document.getElementById('login-passord').addEventListener('keydown', e => { if (e.key === 'Enter') loggInn(); });
</script>
</body>
</html>
