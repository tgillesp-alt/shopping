<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Fager Bistro – FOH Åpning/Stenging</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif; background: #111110; color: #fff; min-height: 100vh; }

header { background: #111110; padding: 1rem 1.25rem; padding-top: calc(1rem + env(safe-area-inset-top)); display: flex; align-items: center; gap: 0.75rem; position: sticky; top: 0; z-index: 100; border-bottom: 0.5px solid rgba(255,255,255,0.08); }
.back-btn { background: none; border: none; color: rgba(255,255,255,0.5); font-size: 0.85rem; cursor: pointer; display: flex; align-items: center; gap: 4px; padding: 0; flex-shrink: 0; text-decoration: none; }
.header-title { font-size: 0.95rem; font-weight: 600; color: #fff; flex: 1; }
.header-actions { display: flex; gap: 0.5rem; }
.btn-sm { padding: 0.4rem 0.75rem; border-radius: 8px; font-size: 0.78rem; font-weight: 600; cursor: pointer; border: none; letter-spacing: 0.03em; }
.btn-reset { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.7); }
.btn-add { background: #fff; color: #111110; }

.main { padding: 1rem 1.25rem; padding-bottom: calc(2rem + env(safe-area-inset-bottom)); max-width: 600px; }

.seksjon { margin-bottom: 1.5rem; }
.seksjon-header { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: rgba(255,255,255,0.3); margin-bottom: 0.5rem; }

.prepp-item { background: rgba(255,255,255,0.06); border: 0.5px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 0.85rem 1rem; margin-bottom: 6px; display: flex; align-items: center; gap: 0.75rem; transition: opacity 0.2s; }
.prepp-item.ferdig { opacity: 0.3; }
.prepp-item input[type=checkbox] { width: 20px; height: 20px; accent-color: #fff; cursor: pointer; flex-shrink: 0; }
.prepp-tekst { flex: 1; font-size: 0.95rem; line-height: 1.4; }
.prepp-item.ferdig .prepp-tekst { text-decoration: line-through; }
.item-actions { display: flex; gap: 0.35rem; flex-shrink: 0; }
.btn-edit, .btn-del { background: none; border: none; color: rgba(255,255,255,0.25); font-size: 0.85rem; cursor: pointer; padding: 0.2rem 0.3rem; border-radius: 6px; }
.btn-edit:active, .btn-del:active { color: #fff; }

.progress-bar { background: rgba(255,255,255,0.08); border-radius: 4px; height: 4px; margin-bottom: 1.5rem; overflow: hidden; }
.progress-fill { background: #fff; height: 100%; border-radius: 4px; transition: width 0.3s; }
.progress-label { font-size: 0.72rem; color: rgba(255,255,255,0.35); margin-bottom: 0.5rem; text-align: right; }

.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 200; display: flex; align-items: flex-end; justify-content: center; backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
.modal { background: #1c1c1a; border-radius: 20px 20px 0 0; padding: 1.5rem 1.25rem; padding-bottom: calc(1.5rem + env(safe-area-inset-bottom)); width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 0.75rem; }
.modal-handle { width: 36px; height: 4px; background: rgba(255,255,255,0.2); border-radius: 2px; margin: 0 auto 0.75rem; }
.modal h3 { font-size: 1rem; font-weight: 600; margin-bottom: 0.25rem; }
.modal input, .modal select { padding: 0.7rem 0.85rem; border: 0.5px solid rgba(255,255,255,0.15); border-radius: 10px; font-size: 0.95rem; background: rgba(255,255,255,0.08); color: #fff; width: 100%; outline: none; }
.modal select option { background: #1c1c1a; }
.modal-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; margin-top: 0.25rem; }
.modal-btns button { padding: 0.8rem; border-radius: 10px; font-size: 0.95rem; font-weight: 600; cursor: pointer; border: none; }
.btn-lagre { background: #fff; color: #111110; }
.btn-avbryt { background: rgba(255,255,255,0.08); color: #fff; }
</style>
</head>
<body>
<header>
  <a href="https://tgillesp-alt.github.io/shopping/portal.html" class="back-btn">‹ Portal</a>
  <div class="header-title">FOH Åpning/Stenging</div>
  <div class="header-actions">
    <button class="btn-sm btn-reset" onclick="nullstill()">Nullstill</button>
    <button class="btn-sm btn-add" onclick="apneNy()">+ Legg til</button>
  </div>
</header>

<div class="main">
  <div class="progress-label" id="progress-label">0 / 0 gjort</div>
  <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
  <div id="liste"></div>
</div>

<div class="modal-overlay" id="modal" style="display:none" onclick="lukkModalOverlay(event)">
  <div class="modal">
    <div class="modal-handle"></div>
    <h3 id="modal-tittel">Legg til punkt</h3>
    <select id="modal-seksjon">
      <option value="">Seksjon (valgfritt)</option>
      <option>ÅPNING</option>
      <option>STENGING</option>
      <option>RENGJØRING</option>
      <option>ANNET</option>
    </select>
    <input type="text" id="modal-tekst" placeholder="Beskrivelse *" autocorrect="off">
    <div class="modal-btns">
      <button class="btn-avbryt" onclick="lukkModal()">Avbryt</button>
      <button class="btn-lagre" onclick="lagreItem()">Lagre</button>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://izdclsyuplghwznsjnom.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml6ZGNsc3l1cGxnaHd6bnNqbm9tIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE1MjY5MjksImV4cCI6MjA5NzEwMjkyOX0.GkjxcToCHZrLAm1pVGsBkcLapIOj7uSYd6IcDC0Lyzk';
const SIDE = 'foh';

let items = [], editId = null;

async function api(method, path, body) {
  const opts = { method, headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json', 'Prefer': method === 'POST' ? 'return=representation' : '' } };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(SUPABASE_URL + '/rest/v1/' + path, opts);
  if (res.status === 204) return [];
  return res.json();
}

async function hent() {
  items = await api('GET', `prepp?side=eq.${SIDE}&order=seksjon.asc,sort_order.asc,created_at.asc&select=*`);
  render();
}

function render() {
  const totalt = items.length;
  const ferdig = items.filter(i => i.ferdig).length;
  const pct = totalt ? Math.round(ferdig / totalt * 100) : 0;
  document.getElementById('progress-label').textContent = `${ferdig} / ${totalt} gjort`;
  document.getElementById('progress-fill').style.width = pct + '%';

  const grouped = {};
  items.forEach(i => {
    const k = i.seksjon || 'ANNET';
    if (!grouped[k]) grouped[k] = [];
    grouped[k].push(i);
  });

  document.getElementById('liste').innerHTML = Object.entries(grouped).map(([seksjon, its]) => `
    <div class="seksjon">
      <div class="seksjon-header">${seksjon}</div>
      ${its.map(i => `
        <div class="prepp-item ${i.ferdig ? 'ferdig' : ''}" id="item-${i.id}">
          <input type="checkbox" ${i.ferdig ? 'checked' : ''} onchange="toggleFerdig('${i.id}', this.checked)">
          <span class="prepp-tekst">${i.tekst}</span>
          <div class="item-actions">
            <button class="btn-edit" onclick="apneRediger('${i.id}')">✎</button>
            <button class="btn-del" onclick="slett('${i.id}')">✕</button>
          </div>
        </div>
      `).join('')}
    </div>
  `).join('');
}

async function toggleFerdig(id, ferdig) {
  await api('PATCH', `prepp?id=eq.${id}`, { ferdig });
  hent();
}

async function slett(id) {
  if (!confirm('Slett dette punktet?')) return;
  await api('DELETE', `prepp?id=eq.${id}`);
  hent();
}

async function nullstill() {
  if (!confirm('Nullstill alle kryss?')) return;
  await api('PATCH', `prepp?side=eq.${SIDE}`, { ferdig: false });
  hent();
}

function apneNy() {
  editId = null;
  document.getElementById('modal-tittel').textContent = 'Legg til punkt';
  document.getElementById('modal-seksjon').value = '';
  document.getElementById('modal-tekst').value = '';
  document.getElementById('modal').style.display = 'flex';
  setTimeout(() => document.getElementById('modal-tekst').focus(), 100);
}

function apneRediger(id) {
  const item = items.find(i => i.id === id);
  if (!item) return;
  editId = id;
  document.getElementById('modal-tittel').textContent = 'Rediger punkt';
  document.getElementById('modal-seksjon').value = item.seksjon || '';
  document.getElementById('modal-tekst').value = item.tekst;
  document.getElementById('modal').style.display = 'flex';
  setTimeout(() => document.getElementById('modal-tekst').focus(), 100);
}

async function lagreItem() {
  const tekst = document.getElementById('modal-tekst').value.trim();
  const seksjon = document.getElementById('modal-seksjon').value || null;
  if (!tekst) { alert('Skriv inn beskrivelse'); return; }
  if (editId) {
    await api('PATCH', `prepp?id=eq.${editId}`, { tekst, seksjon });
  } else {
    await api('POST', 'prepp', { side: SIDE, seksjon, tekst, ferdig: false });
  }
  lukkModal();
  hent();
}

function lukkModal() { document.getElementById('modal').style.display = 'none'; editId = null; }
function lukkModalOverlay(e) { if (e.target === document.getElementById('modal')) lukkModal(); }

hent();
setInterval(hent, 20000);
</script>
</body>
</html>
