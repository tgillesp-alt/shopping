<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Fager Bistro – Meny</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #f7f6f3; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: #1a1a1a; min-height: 100vh; }

.page { max-width: 560px; margin: 0 auto; padding: 2rem 1.25rem 4rem; }

.logo-wrap { text-align: center; margin-bottom: 1.5rem; }
.logo-wrap img { height: 80px; width: auto; }


.section-title { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em; color: #9A0203; border-bottom: 1px solid #e5e2da; padding-bottom: 0.5rem; margin: 1.75rem 0 1rem; }

.dish { margin-bottom: 1.1rem; }
.dish-head { display: flex; justify-content: space-between; align-items: baseline; gap: 0.5rem; }
.dish-name { font-size: 0.95rem; font-weight: 700; }
.dish-price { font-size: 0.95rem; font-weight: 700; white-space: nowrap; }
.dish-allergens { font-size: 0.72rem; color: #a8a59d; margin-top: 1px; }
.dish-desc { font-size: 0.82rem; color: #5a5855; font-style: italic; margin-top: 2px; line-height: 1.4; }

.allergen-key { margin-top: 2.5rem; padding-top: 1rem; border-top: 1px solid #e5e2da; font-size: 0.65rem; color: #a8a59d; line-height: 1.5; text-align: center; }

.loading { text-align: center; padding: 3rem; color: #a8a59d; font-size: 0.9rem; }
.error { text-align: center; padding: 2rem; color: #9A0203; font-size: 0.85rem; }
</style>
</head>
<body>
<div class="page">
  <div class="logo-wrap">
    <img src="logo-print.png" alt="Fager Bistro">
  </div>


  <div id="meny-innhold"><div class="loading">Laster meny…</div></div>
  <div id="sist-oppdatert" style="text-align:center; font-size:0.72rem; color:#a8a59d; margin-top:-0.5rem; margin-bottom:1.5rem;"></div>

  <div class="allergen-key">
    Allergener: E Egg, F Fisk, L Lactose, Sn Sennep, Pi Pistasj, So Soya, Se Sesam, By Bygg, H Hvete, Ha Havre,
    R Rug, Vn Valnøtt, S Selleri, Su sulfitt, N Nøtter, Ma Mandel, Mo Mollusc, Sk Skalldyr
  </div>
</div>

<script>
const SUPABASE_URL = 'https://izdclsyuplghwznsjnom.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Iml6ZGNsc3l1cGxnaHd6bnNqbm9tIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE1MjY5MjksImV4cCI6MjA5NzEwMjkyOX0.GkjxcToCHZrLAm1pVGsBkcLapIOj7uSYd6IcDC0Lyzk';

const katRekkefølge = [
  'huîtres', 'østers',
  'entrées', 'forretter',
  'plats', 'hovedretter',
  'fromage', 'ost',
  'desserts', 'desserter'
];

function katSort(a, b) {
  const ai = katRekkefølge.findIndex(k => a.toLowerCase().includes(k));
  const bi = katRekkefølge.findIndex(k => b.toLowerCase().includes(k));
  return (ai === -1 ? 999 : ai) - (bi === -1 ? 999 : bi);
}

async function lastMeny() {
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/meny_retter?meny=eq.middag&order=sort_order.asc,created_at.asc`, {
      headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` }
    });
    if (!res.ok) throw new Error();
    const retter = await res.json();

    const kategorier = [...new Set(retter.map(r => r.kategori))].sort(katSort);

    const html = kategorier.map(kat => `
      <div class="section-title">${kat}</div>
      ${retter.filter(r => r.kategori === kat).map(r => `
        <div class="dish">
          <div class="dish-head">
            <span class="dish-name">${r.navn}</span>
            ${r.pris != null ? `<span class="dish-price">${r.pris}</span>` : ''}
          </div>
          ${r.allergener ? `<div class="dish-allergens">${r.allergener}</div>` : ''}
          ${r.beskrivelse ? `<div class="dish-desc">${r.beskrivelse}</div>` : ''}
        </div>
      `).join('')}
    `).join('');

    document.getElementById('meny-innhold').innerHTML = html;

    const sistOppdatert = retter.reduce((max, r) => {
      const d = new Date(r.updated_at || r.created_at);
      return d > max ? d : max;
    }, new Date(0));
    if (sistOppdatert > new Date(0)) {
      document.getElementById('sist-oppdatert').textContent =
        'Oppdatert ' +
        sistOppdatert.toLocaleDateString('no-NO', { day: 'numeric', month: 'numeric' }).replace('.', '/').replace(' ', '') + ' ' +
        sistOppdatert.toLocaleTimeString('no-NO', { hour: '2-digit', minute: '2-digit' });
    }
  } catch(e) {
    document.getElementById('meny-innhold').innerHTML = '<div class="error">Kunne ikke laste menyen. Prøv igjen.</div>';
  }
}

function delMeny() {
  const url = window.location.href.split('?')[0];
  if (navigator.share) {
    navigator.share({ title: 'Fager Bistro – Meny', url });
  } else {
    navigator.clipboard.writeText(url).then(() => {
      const btn = document.querySelector('.del-btn');
      btn.textContent = '✓ Lenke kopiert!';
      btn.classList.add('copied');
      setTimeout(() => {
        btn.innerHTML = '<svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 12v8a2 2 0 002 2h12a2 2 0 002-2v-8M16 6l-4-4-4 4M12 2v13"/></svg> Del meny';
        btn.classList.remove('copied');
      }, 2500);
    });
  }
}

lastMeny();
</script>
</body>
</html>
